# Model catalog + tier map.
#
# tiers: which catalog entry fills each slot. null = not chosen yet.
#        Only used when TRIAGE_BACKEND=real; with TRIAGE_BACKEND=fake every tier is a scripted fake.
# catalog: every model we might use. Fields:
#   provider   vertex_gemini | vertex_maas | bedrock
#   model      provider's model ID
#   region     optional; vertex_maas defaults to us-central1, bedrock to AWS_REGION
#   price      USD per 1M tokens: {input, output}. Without it, the call's cost is reported as unknown.
#              Fetched 2026-10-27, standard on-demand rates (not batch / priority / cached):
#                bedrock: AWS Price List API, us-east-2.
#                vertex:  cloud.google.com Vertex AI pricing page, global endpoint, prompts <= 200K tokens.
#   settings   passed straight to PydanticAI as model settings
#   tested     last date it answered `uv run triage-smoke`; null if it never has
#   reasoning_levels
#              efforts the model was checked to honour (thinking tokens rise low -> high, 2026-10-27).
#              Such a model only runs with a fixed effort: TRIAGE_REASONING / triage-eval --reasoning.
#              Not set on Nemotron (ignores the setting; nano-9b also leaks </think> into answers) or
#              Qwen3-235B-2507 (instruct model, does not reason).

tiers:
  cheap: bedrock-gpt-oss-20b  # chosen 2026-11-08: best accuracy per $ of the 10 candidates (results/cheap-*)
  smart: null
  frontier: vertex-gemini-4-argon

# The second-opinion model for v2's cross_agreement check: a different cheap model answers the same request
# and a disagreement escalates. Chosen 2026-11-23 on saved answers (triage.eval.checks_report): the same
# price as the cheap tier and more accurate than it on document QA, the one task type that uses it.
verifier: bedrock-gemma-3-12b

defaults:
  timeout_s: 120
  max_retries: 2
  settings:
    max_tokens: 2048

