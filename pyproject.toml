[project]
name = "triage"
version = "0.1.0"
description = "Adaptive routing between cheap and frontier LLMs, with escalation on failure."
readme = "README.md"
authors = [
    { name = "Mbebo Nonna" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langfuse>=5.0.4",
    "pydantic-ai-slim[bedrock,google,openai]>=2.55.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
triage-smoke = "triage.smoke:main"
triage-eval = "triage.eval.cli:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pandas>=3.1.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Prompt templates: long text lines are content, not code.
"src/triage/eval/synthetic.py" = ["E501"]
